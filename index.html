<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이영민 · 유건민 결혼합니다</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@300;500&display=swap">
<style>
:root{--bg:#fbfaf7;--surface:#f1eee7;--ink:#1d2433;--sub:#667085;--accent:#1f3358;--line:#d8cfba;--gold:#9a7f4b;
--serif:"Noto Serif KR","Nanum Myeongjo",serif;--sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--surface:#171c27;--ink:#ebe8df;--sub:#9aa3b5;--accent:#a9bde3;--line:#3a3f4d;--gold:#c2a56b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141c;--surface:#171c27;--ink:#ebe8df;--sub:#9aa3b5;--accent:#a9bde3;--line:#3a3f4d;--gold:#c2a56b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-weight:300;line-height:1.95;font-size:15px;word-break:keep-all}
main{max-width:480px;margin:0 auto}
section{padding:72px 28px;text-align:center}
h2{font-family:var(--serif);font-weight:500;font-size:19px;margin:0 0 28px;letter-spacing:.04em}
p{margin:0 0 1.2em}
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;padding:56px 28px 48px;background:var(--surface)}
.hero::before{content:"";position:absolute;inset:14px;border:1px solid var(--gold);pointer-events:none}.hero::after{content:"";position:absolute;inset:19px;border:1px solid var(--line);pointer-events:none}.hero .date{font-family:var(--serif);font-weight:300;font-size:64px;line-height:1.05;letter-spacing:.02em;text-align:center}
.hero .date small{display:block;font-size:15px;font-family:var(--sans);letter-spacing:.2em;color:var(--sub);margin-bottom:12px}
.photo{aspect-ratio:3/4;width:72%;margin:0 auto;border:1px solid var(--line);display:grid;place-items:center;color:var(--sub);font-size:13px;background:var(--bg)}
.photo.poster{aspect-ratio:2/3;width:76%}.photo.wide{width:100%;aspect-ratio:auto;margin-bottom:40px;border-color:var(--gold)}.photo.wide img{height:auto}.photo.poster img{object-fit:contain}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.names{font-family:var(--serif);font-size:24px;letter-spacing:.12em;text-align:center}
.names span{color:var(--sub);font-size:15px;margin:0 .6em}
.hero .where{text-align:center;color:var(--sub);font-size:14px;margin-top:6px}
.parents{color:var(--sub);font-size:14px;line-height:2}
.parents b{font-weight:500;color:var(--ink)}
.cal{max-width:320px;margin:0 auto 24px;display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;font-size:14px}
.cal i{font-style:normal;color:var(--sub);font-size:12px}
.cal .sun{color:#b5524a}
.cal .me{background:var(--accent);color:var(--bg);border-radius:50%;width:34px;height:34px;line-height:34px;margin:auto;font-weight:500}
.dday{font-family:var(--serif);font-size:17px}
.dday b{color:var(--accent);font-weight:500}
.addr{font-weight:400;margin-bottom:4px}
.btns{display:flex;gap:10px;justify-content:center;margin:22px 0}
.btn{appearance:none;border:1px solid var(--accent);background:none;color:var(--accent);font:inherit;font-size:14px;padding:10px 18px;border-radius:999px;text-decoration:none;cursor:pointer}
.btn:hover,.btn:focus-visible{background:var(--accent);color:var(--bg);outline:none}
.how{text-align:left;font-size:14px;color:var(--sub);border-top:1px solid var(--line);padding-top:20px;margin-top:24px}
.how b{color:var(--ink);font-weight:500}
details{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;text-align:left}
summary{padding:14px 18px;cursor:pointer;font-weight:400;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";color:var(--accent)}details[open] summary::after{content:"−"}
.acc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--line);font-size:14px}
.acc small{color:var(--sub);display:block;line-height:1.5}
.acc .btn{padding:6px 14px;font-size:13px;flex:none}
footer{padding:48px 28px 72px;text-align:center;color:var(--sub);font-size:13px;background:var(--surface)}
#toast{position:fixed;left:50%;bottom:calc(32px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

<script>
// ▼ 여기만 수정하면 됩니다 (예시 정보입니다)
const C = {
  groom: "이영민", bride: "유건민",
  date: "2028-12-02", time: "오후 1시",
  venue: "서울 청담 더킹포레스트올라잇 호텔",
  address: "",
  mapQuery: "서울 청담 더킹포레스트올라잇 호텔",
  groomParents: [], brideParents: [],
  how: [],
  accounts: {
    "신랑측": [["신랑 이영민", "은행 000-000-000000"]],
    "신부측": [["신부 유건민", "은행 000-000-000000"]]
  }
};
// ▲

const $ = id => document.getElementById(id);
const d = new Date(C.date + "T00:00:00");
const Y = d.getFullYear(), M = d.getMonth(), D = d.getDate();
const dow = ["일","월","화","수","목","금","토"][d.getDay()];

document.title = C.groom + " ♥ " + C.bride + " 결혼합니다";
$("heroDate").innerHTML = `<small>WEDDING DAY</small>${Y}<br>${String(M+1).padStart(2,"0")}.${String(D).padStart(2,"0")}`;
$("names").innerHTML = `${C.groom}<span>그리고</span>${C.bride}`;
$("heroWhere").textContent = `${Y}년 ${M+1}월 ${D}일 ${dow}요일 ${C.time}`;
$("parents").innerHTML = !C.groomParents.length ? "" :
  `<b>${C.groomParents[0]}</b> · <b>${C.groomParents[1]}</b>의 아들 <b>${C.groom}</b><br>` +
  `<b>${C.brideParents[0]}</b> · <b>${C.brideParents[1]}</b>의 딸 <b>${C.bride}</b>`;

$("calTitle").textContent = `${Y}년 ${M+1}월 ${D}일 ${dow}요일 ${C.time}`;
let h = ["일","월","화","수","목","금","토"].map((x,i)=>`<i${i?"":' class="sun"'}>${x}</i>`).join("");
const first = new Date(Y, M, 1).getDay(), last = new Date(Y, M+1, 0).getDate();
for (let i=0;i<first;i++) h += "<span></span>";
for (let n=1;n<=last;n++){
  const w = (first+n-1)%7;
  h += n===D ? `<span class="me">${n}</span>` : `<span${w===0?' class="sun"':""}>${n}</span>`;
}
$("cal").innerHTML = h;
const diff = Math.round((d - new Date(new Date().setHours(0,0,0,0))) / 864e5);
$("dday").innerHTML = diff>0 ? `${C.groom} · ${C.bride}의 결혼식이 <b>${diff}일</b> 남았습니다`
  : diff===0 ? "<b>오늘</b>, 저희가 결혼합니다" : "함께해 주셔서 감사합니다";

$("venue").textContent = C.venue;
$("addr").textContent = C.address;
$("naver").href = "https://map.naver.com/p/search/" + encodeURIComponent(C.mapQuery);
$("kakao").href = "https://map.kakao.com/?q=" + encodeURIComponent(C.mapQuery);
$("how").innerHTML = C.how.map(([k,v])=>`<p><b>${k}</b><br>${v}</p>`).join("");
$("how").hidden = !C.how.length;

$("accounts").innerHTML = Object.entries(C.accounts).map(([side, list]) =>
  `<details><summary>${side}</summary>` + list.map(([who, acc]) =>
    `<div class="acc"><div><small>${who}</small>${acc}</div><button class="btn" data-acc="${acc}">복사</button></div>`).join("") + `</details>`).join("");

function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("on"); setTimeout(()=>el.classList.remove("on"),1800); }
async function copy(text, msg){
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch(e){
    try { const t=document.createElement("textarea"); t.value=text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); toast(msg); }
    catch(_){ toast("복사하지 못했어요. 직접 선택해 복사해 주세요."); }
  }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-acc]");
  if (b) copy(b.dataset.acc.replace(/^\S+\s/,""), "계좌번호를 복사했어요");
});
$("share").addEventListener("click", () => copy(location.href.split("#")[0], "링크를 복사했어요"));
</script>
</body>
</html>
